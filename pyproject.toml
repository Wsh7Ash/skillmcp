[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmcp"
version = "1.0.0"
description = "MCP stdio server that indexes skill packs for agents, plus 50 validated skills about running it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["mcp", "json-rpc", "skills", "agents", "bug-bounty", "stdio"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillmcp = "skillmcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillmcp = ["corpus/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
